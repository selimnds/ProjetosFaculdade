<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: black;
            margin: 0;
            padding: 0;
        }

        .scene{
            margin: 80px auto;
            width: 210px;
            position: relative;
            aspect-ratio: 4 / 5;
            perspective: 1000px;
        }
        .carousel{
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 30s infinite linear;
        }
        .carousel>img{
            position: absolute;
            top: 0;
            left: 0;
            width: 190px;
            aspect-ratio: 4 / 5;
            border-radius: 10px;
            transform: rotateY(var(--i) translateZ(288px));
        }
        @keyframes rotate {
            0% {transform: rotateY(360deg);}
            100% {transform: rotateY(0deg);}
        }

    </style>
</head>

<body>
    <div class="scene">
        <div class="carousel">
            <img src="imagem1.jpg" style="--i:000deg">
            <img src="imagem1-2.jpg" style="--i:040deg">
            <img src="imagem1-3.jpg" style="--i:080deg">
            <img src="imagem1-4.jpg" style="--i:120deg">
            <img src="imagem1-5.png" style="--i:160deg">
            <img src="imagem1-6.jpg" style="--i:200deg">
            <img src="imagem1-7.jpg" style="--i:240deg">
            <img src="imagem1-8.jpg" style="--i:280deg">
            <img src="imagem-9.jpg" style="--i:320deg">
        </div>
    </div>
</body>

</html>
